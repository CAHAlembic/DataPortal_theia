# Electron Builder Configuration for DataPortal Data Engineering
# Copyright © 2025 Alembic Technologies, Inc.

appId: com.alembic.dataportal
productName: DataPortal Data Engineering
copyright: Copyright © 2025 Alembic Technologies, Inc.

directories:
  output: dist
  buildResources: resources

files:
  - lib/**
  - src-gen/**
  - resources/**
  - package.json

extraResources:
  - from: resources
    to: resources

# macOS configuration
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  darkModeSupport: true

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

# Windows configuration
win:
  target:
    - nsis
    - portable
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DataPortal Data Engineering

# Linux configuration
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  icon: resources/icons
  category: Development
  synopsis: GPU-Native Data Analytics IDE
  description: DataPortal Data Engineering - Alembic's GPU-Native Data Analytics IDE for data engineers and scientists.
  vendor: Alembic Technologies, Inc.

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3

# Build configuration
compression: normal
asar: true
asarUnpack:
  - "**/*.node"

# Publish configuration (disabled for now)
publish: null
